<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f8faf8" />
    <meta name="robots" content="noindex, nofollow" />
    <meta
      name="description"
      content="The Wendoo School Breakfast Empowerment Initiative website is currently being refreshed."
    />
    <title>Wendoo | Website refresh in progress</title>
    <link rel="icon" href="/assets/wendoo-logo.jpg" type="image/jpeg" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="ambient ambient--teal" aria-hidden="true"></div>
    <div class="ambient ambient--red" aria-hidden="true"></div>

    <div class="page-shell">
      <header class="site-header" aria-label="Wendoo identity">
        <img
          class="brand-logo"
          src="/assets/wendoo-logo.jpg"
          width="738"
          height="345"
          alt="Wendoo — Wendoo School Breakfast Empowerment Initiative"
        />
      </header>

      <main class="hero">
        <div class="hero-copy">
          <div class="status" role="status">
            <span class="status-dot" aria-hidden="true"></span>
            <span>Website refresh in progress</span>
          </div>

          <p class="eyebrow">We’re refreshing our digital home</p>
          <h1>A brighter experience<br class="desktop-break" /> is on the way.</h1>
          <p class="intro">
            The Wendoo School Breakfast Empowerment Initiative website is currently being
            refreshed. Please check back soon.
          </p>
        </div>

        <div class="community-mark" aria-hidden="true">
          <span class="orbit orbit--outer"></span>
          <span class="orbit orbit--inner"></span>
          <span class="person person--top"></span>
          <span class="person person--right"></span>
          <span class="person person--bottom"></span>
          <span class="person person--left"></span>
          <span class="community-core"></span>
        </div>
      </main>

      <footer class="site-footer">
        <span class="footer-line" aria-hidden="true"></span>
        <p>© 2026 Wendoo School Breakfast Empowerment Initiative</p>
      </footer>
    </div>
  </body>
</html>
